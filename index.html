<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acme Admin: a production-grade React dashboard template."
    />
    <!-- An admin app has nothing to index; robots.txt says the same. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b1120"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Acme Admin</title>
    <!--
      Applies the saved theme before first paint, so dark-mode users never see a
      white flash. An external file rather than an inline script keeps the
      Content Security Policy strict (script-src 'self').
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>This application requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
